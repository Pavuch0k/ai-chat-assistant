services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_chat}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.6.1
    container_name: ai-chat-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: ai-chat-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_chat}
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_PROXY_URL=${OPENAI_PROXY_URL:-}
      - OPENAI_PROXY_USERNAME=${OPENAI_PROXY_USERNAME:-}
      - OPENAI_PROXY_PASSWORD=${OPENAI_PROXY_PASSWORD:-}
      - BITRIX24_WEBHOOK_URL=${BITRIX24_WEBHOOK_URL:-}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-False}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Монтируем venv если он существует (для ускорения запуска, избегаем переустановки зависимостей)
      - ./venv:/app/venv:ro
      - pip_cache:/root/.cache/pip
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    # Используем venv если он смонтирован, иначе используем системный Python
    # Устанавливаем недостающие зависимости при запуске
    command: >
      sh -c "
        if [ -d /app/venv ] && [ -f /app/venv/bin/python ]; then
          echo 'Using mounted venv dependencies from local venv';
          export PYTHONPATH=/app:/app/venv/lib/python3.11/site-packages:/app/venv/lib/python3.12/site-packages:/app/venv/lib/python3.13/site-packages:/app/venv/lib/python3.14/site-packages;
          /app/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
        else
          echo 'Using container dependencies';
          # Проверяем и устанавливаем недостающие зависимости
          pip install -q socksio==1.0.0 httpx-socks==0.8.1 2>/dev/null || true;
          uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload;
        fi
      "

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ai-chat-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  pip_cache:
  uploads_data:
